apiVersion: apps/v1
kind: Deployment

metadata:
  name: mailpit

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mailpit

  template:
    metadata:
      labels:
        app: mailpit

    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit
          ports:
            - containerPort: 1025
            - containerPort: 8025
