apiVersion: apps/v1
kind: Deployment

metadata:
  name: queueforge-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: queueforge-api

  template:
    metadata:
      labels:
        app: queueforge-api

    spec:
      containers:
        - name: queueforge-api
          image: queueforge-api:latest
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "dev", "-w", "api"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: queueforge-config 
            - secretRef:
                name: queueforge-secret