apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker

spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  
  template:
    metadata:
      labels:
        app: worker
    
    spec:
      containers:
       - name: worker
         image: queueforge-worker:latest
         imagePullPolicy: Never
         command: ["npm", "run", "dev", "-w", "worker"]
         envFrom:
           - configMapRef:
               name: queueforge-config
           - secretRef:
               name: queueforge-secret